name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Without this every job re-downloads the embedding model from Hugging Face, three times per
      # push, which earns an HTTP 429 and fails a run that has nothing wrong with it.
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cairn/models
          key: cairn-models-${{ runner.os }}-all-MiniLM-L6-v2
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        # Several hook tests spawn the CLI eight times over; a cold Windows runner needs well past
        # Bun's 5s default, and one of them timed out at 13s while passing everywhere else.
        run: bun test --timeout 30000
